<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title or "Log in" }} – {{ site }}</title>
<style>
  :root { --bg:#f4f4f5; --card:#fff; --fg:#18181b; --muted:#71717a; --accent:#cc2936; --border:#e4e4e7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#18181b; --card:#27272a; --fg:#f4f4f5; --muted:#a1a1aa; --border:#3f3f46; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
  main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--border);
         border-radius:12px; padding:28px; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  .site { color:var(--muted); font-size:.875rem; margin:0 0 20px; }
  label { display:block; font-size:.875rem; margin:14px 0 4px; }
  input[type=text], input[type=password] { width:100%; padding:10px 12px; font:inherit; color:inherit;
         background:transparent; border:1px solid var(--border); border-radius:8px; }
  button { margin-top:20px; width:100%; padding:10px; font:inherit; font-weight:600; border:0; border-radius:8px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button.link { background:none; color:var(--muted); font-weight:400; margin-top:8px; }
  .error { background:#fde8ea; color:#8a1c25; padding:10px 12px; border-radius:8px; font-size:.875rem; }
  p { margin: 0 0 12px; }
  .note { color:var(--muted); font-size:.875rem; }
  .account { padding:10px 12px; border:1px solid var(--border); border-radius:8px; }
  .divider { color:var(--muted); font-size:.875rem; text-align:center; margin:20px 0 0; }
  a.button { display:block; text-align:center; text-decoration:none; margin-top:8px; padding:10px; font-weight:600;
             border-radius:8px; background:var(--accent); color:#fff; }
  button.secondary { background:transparent; color:var(--fg); border:1px solid var(--border); }
</style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
