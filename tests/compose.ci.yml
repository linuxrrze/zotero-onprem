# CI-only additions to docker-compose.yml (selected via COMPOSE_FILE in .env):
# a mock OpenID Connect provider for the single sign-on end-to-end test.
#
# The IdP is reached under the same name from the login container (back
# channel: discovery, token, userinfo) and from the test runner acting as the
# browser (front channel: authorize). The runner maps "mock-oidc" to 127.0.0.1
# in /etc/hosts; the issuer in the tokens is http://mock-oidc:8080/zotero.
services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: >-
        {"interactiveLogin": false,
         "tokenCallbacks": [{
           "issuerId": "zotero",
           "tokenExpiry": 300,
           "requestMappings": [{
             "requestParam": "code", "match": "*",
             "claims": {
               "sub": "c2f1e0a4-bob",
               "aud": ["zotero-onprem"],
               "preferred_username": "bob",
               "email": "bob@zotero.test",
               "email_verified": true,
               "eduperson_affiliation": ["member@zotero.test", "staff@zotero.test"]
             }}]}]}

  login:
    environment:
      # The mock IdP speaks plain HTTP; never set this in production.
      AUTHLIB_INSECURE_TRANSPORT: "1"
    depends_on:
      mock-oidc: { condition: service_started }
