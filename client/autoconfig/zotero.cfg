// Zotero on-premise -- system-wide settings, loaded by AutoConfig.
// Place into the Zotero install dir (next to zotero.exe / zotero-bin).
// The FIRST LINE of this file is always ignored by AutoConfig -- keep this comment.
//
// lockPref = users cannot change it; defaultPref = default, user may override.
lockPref("extensions.zotero.api.url", "https://ZOTERO_HOST/");
lockPref("extensions.zotero.streaming.url", "wss://ZOTERO_HOST/stream/");
defaultPref("security.enterprise_roots.enabled", true);
defaultPref("extensions.zotero.retractions.enabled", false);
defaultPref("extensions.zotero.reportTranslationFailure", false);
// defaultPref("extensions.zotero.automaticScraperUpdates", false);
